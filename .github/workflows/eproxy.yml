name: EProxy + Cloudflare Quick Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests

      - name: Start EProxy
        run: |
          nohup python eproxy.py > eproxy.log 2>&1 &
          echo $! > eproxy.pid

          echo "Waiting for proxy..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8989/ > /dev/null 2>&1; then
              echo "Proxy is running."
              break
            fi
            sleep 1
          done

          cat eproxy.log || true

      - name: Install Cloudflared
        run: |
          curl -L \
            --fail \
            --silent \
            --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup cloudflared tunnel \
            --url http://127.0.0.1:8989 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid

          echo "Waiting for Cloudflare tunnel..."

          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "========================================"
          echo "      CLOUDFLARE QUICK TUNNEL"
          echo "========================================"
          echo ""

          if [ -n "$TUNNEL_URL" ]; then
            echo "Proxy URL:"
            echo "$TUNNEL_URL"
            echo ""
            echo "========================================"

            echo "## 🚀 EProxy" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Cloudflare URL:**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$TUNNEL_URL\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ERROR: Cloudflare tunnel URL was not detected."
            echo ""
            cat cloudflared.log
            exit 1
          fi

      - name: Keep proxy and tunnel alive
        run: |
          echo "EProxy PID: $(cat eproxy.pid)"
          echo "Cloudflared PID: $(cat cloudflared.pid)"
          echo ""
          echo "Tunnel is running..."
          echo "Press Ctrl+C locally only if testing; GitHub will keep this job running."

          while true; do
            if ! kill -0 "$(cat eproxy.pid)" 2>/dev/null; then
              echo "EProxy stopped!"
              cat eproxy.log
              exit 1
            fi

            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflared stopped!"
              cat cloudflared.log
              exit 1
            fi

            sleep 30
          done

      - name: Show logs
        if: always()
        run: |
          echo "===== EProxy log ====="
          cat eproxy.log || true

          echo ""
          echo "===== Cloudflared log ====="
          cat cloudflared.log || true
