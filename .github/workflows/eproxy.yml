name: EProxy + Cloudflare Quick Tunnel

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Extract cookies with Playwright
        shell: bash
        env:
          EP_USERNAME: ${{ secrets.EP_USERNAME }}
          EP_PASSWORD: ${{ secrets.EP_PASSWORD }}
        run: |
          set -e

          EXTRACTOR=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "extract_cookies.py" -print -quit)

          if [ -z "$EXTRACTOR" ]; then
            echo "❌ extract_cookies.py not found!"
            exit 1
          fi

          cd "$(dirname "$EXTRACTOR")"
          python "$(basename "$EXTRACTOR")"
          echo "[ok] cookies.txt ready"

      - name: Start EProxy with Gunicorn
        shell: bash
        env:
          STREAMZY_TOKEN: ${{ secrets.STREAMZY_TOKEN }}
          EP_USERNAME: ${{ secrets.EP_USERNAME }}
          EP_PASSWORD: ${{ secrets.EP_PASSWORD }}
        run: |
          set -e

          EPROXY=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "eproxy.py" -print -quit)

          if [ -z "$EPROXY" ]; then
            echo "❌ eproxy.py not found!"
            exit 1
          fi

          cd "$(dirname "$EPROXY")"

          echo "Starting EProxy (gunicorn)..."

          nohup gunicorn \
            -w 2 --threads 16 \
            -b 0.0.0.0:8989 \
            --timeout 0 \
            --access-logfile - \
            eproxy:app \
            > "$GITHUB_WORKSPACE/eproxy.log" 2>&1 &

          EPROXY_PID=$!
          echo "$EPROXY_PID" > "$GITHUB_WORKSPACE/eproxy.pid"

          echo "EProxy PID: $EPROXY_PID"

          sleep 3

          if ! kill -0 "$EPROXY_PID" 2>/dev/null; then
            echo "❌ EProxy stopped!"
            cat "$GITHUB_WORKSPACE/eproxy.log"
            exit 1
          fi

          echo "✅ EProxy is running."

      - name: Check proxy port
        shell: bash
        run: |
          echo "Checking port 8989..."

          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/8989) >/dev/null 2>&1; then
              echo "✅ Port 8989 is open."
              exit 0
            fi
            sleep 1
          done

          echo "❌ Port 8989 is not open."
          cat eproxy.log || true
          exit 1

      - name: Install Cloudflared
        shell: bash
        run: |
          set -e

          curl -L \
            --fail --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          echo "Cloudflared version:"
          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8989 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!
          echo "$CLOUDFLARED_PID" > cloudflared.pid

          echo "Waiting for tunnel URL..."

          TUNNEL_URL=""

          for i in {1..60}; do
            TUNNEL_URL=$(grep -oE \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              cloudflared.log \
              | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "❌ Cloudflared stopped!"
              cat cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not obtain Cloudflare tunnel URL."
            cat cloudflared.log
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "       CLOUDFLARE QUICK TUNNEL"
          echo "=============================================="
          echo ""
          echo "🌐 $TUNNEL_URL"
          echo ""
          echo "=============================================="

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          {
            echo "# 🚀 EProxy"
            echo ""
            echo "## Cloudflare Quick Tunnel"
            echo ""
            echo "\`$TUNNEL_URL\`"
            echo ""
            echo "### Proxy endpoint"
            echo ""
            echo "$TUNNEL_URL/proxy?url=<encoded-url>"
            echo ""
            echo "### Player"
            echo ""
            echo "$TUNNEL_URL/player"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify processes
        shell: bash
        run: |
          EPROXY_PID=$(cat eproxy.pid)
          CLOUDFLARED_PID=$(cat cloudflared.pid)

          if kill -0 "$EPROXY_PID" 2>/dev/null; then
            echo "✅ EProxy running"
          else
            echo "❌ EProxy not running"
            cat eproxy.log || true
            exit 1
          fi

          if kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo "✅ Cloudflared running"
          else
            echo "❌ Cloudflared not running"
            cat cloudflared.log || true
            exit 1
          fi

      - name: Keep proxy and tunnel alive
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "             PROXY IS LIVE"
          echo "=============================================="
          echo ""
          echo "🌐 $TUNNEL_URL"
          echo "=============================================="

          while true; do
            EPROXY_PID=$(cat eproxy.pid 2>/dev/null)
            CLOUDFLARED_PID=$(cat cloudflared.pid 2>/dev/null)

            if ! kill -0 "$EPROXY_PID" 2>/dev/null; then
              echo "❌ EProxy stopped!"
              cat eproxy.log || true
              exit 1
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "❌ Cloudflared stopped!"
              cat cloudflared.log || true
              exit 1
            fi

            sleep 30
          done

      - name: Show logs
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "               EPROXY LOG"
          echo "=============================================="
          cat eproxy.log || true

          echo ""
          echo "=============================================="
          echo "            CLOUDFLARED LOG"
          echo "=============================================="
          cat cloudflared.log || true
