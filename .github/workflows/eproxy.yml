name: EProxy + Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      keepalive_hours:
        description: "Hours to keep proxy running (max 6)"
        required: false
        default: "6"
        type: string
      send_telegram:
        description: "Send Tunnel URL notification to Telegram"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          playwright install chromium

      - name: Extract cookies with Playwright
        shell: bash
        env:
          EP_USERNAME: ${{ secrets.EP_USERNAME }}
          EP_PASSWORD: ${{ secrets.EP_PASSWORD }}
        run: |
          set -e

          EXTRACTOR=$(find "$GITHUB_WORKSPACE" -type f -iname "extract_cookies.py" -print -quit)

          if [ -z "$EXTRACTOR" ]; then
            echo "extract_cookies.py not found!"
            exit 1
          fi

          cd "$(dirname "$EXTRACTOR")"
          python "$(basename "$EXTRACTOR")"
          echo "[ok] cookies.txt ready"

      - name: Start EProxy with Gunicorn
        shell: bash
        env:
          STREAMZY_TOKEN: ${{ secrets.STREAMZY_TOKEN }}
          EP_USERNAME: ${{ secrets.EP_USERNAME }}
          EP_PASSWORD: ${{ secrets.EP_PASSWORD }}
        run: |
          set -e

          EPROXY=$(find "$GITHUB_WORKSPACE" -type f -iname "eproxy.py" -print -quit)

          if [ -z "$EPROXY" ]; then
            echo "eproxy.py not found!"
            exit 1
          fi

          cd "$(dirname "$EPROXY")"
          echo "Starting EProxy (gunicorn)..."

          nohup gunicorn \
            -w 2 --threads 16 \
            -b 0.0.0.0:8989 \
            --timeout 0 \
            --access-logfile - \
            eproxy:app \
            > "$GITHUB_WORKSPACE/eproxy.log" 2>&1 &

          EPROXY_PID=$!
          echo "$EPROXY_PID" > "$GITHUB_WORKSPACE/eproxy.pid"
          echo "EProxy PID: $EPROXY_PID"

          sleep 3

          if ! kill -0 "$EPROXY_PID" 2>/dev/null; then
            echo "EProxy failed to start!"
            cat "$GITHUB_WORKSPACE/eproxy.log"
            exit 1
          fi

          echo "EProxy is running."

      - name: Check proxy port
        shell: bash
        run: |
          echo "Checking port 8989..."
          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/8989) >/dev/null 2>&1; then
              echo "Port 8989 is open."
              exit 0
            fi
            sleep 1
          done

          echo "Port 8989 is not open."
          cat "$GITHUB_WORKSPACE/eproxy.log" || true
          exit 1

      - name: Install Cloudflared
        shell: bash
        run: |
          set -e
          curl -L --fail --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          echo "Cloudflared version: $(cloudflared --version)"

      - name: Start Cloudflare Tunnel
        shell: bash
        env:
          CF_CERT_TOKEN: ${{ secrets.CF_CERT_TOKEN }}
          CF_TUNNEL_NAME: ${{ secrets.CF_TUNNEL_NAME }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: |
          set -e

          TUNNEL_STARTED=false

          if [ -n "$CF_CERT_TOKEN" ] && [ -n "$CF_TUNNEL_NAME" ] && [ -n "$CF_DOMAIN" ]; then
            echo "Attempting Named Tunnel Mode..."
            mkdir -p ~/.cloudflared
            echo "$CF_CERT_TOKEN" | base64 -d > ~/.cloudflared/cert.pem 2>/dev/null || true

            nohup cloudflared tunnel --origincert ~/.cloudflared/cert.pem run \
              --url http://127.0.0.1:8989 \
              "$CF_TUNNEL_NAME" \
              > "$GITHUB_WORKSPACE/cloudflared.log" 2>&1 &

            CLOUDFLARED_PID=$!
            sleep 3
            if kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              TUNNEL_URL="https://$CF_DOMAIN"
              TUNNEL_STARTED=true
              echo "$CLOUDFLARED_PID" > "$GITHUB_WORKSPACE/cloudflared.pid"
              echo "Named tunnel started at $TUNNEL_URL"
            else
              echo "Named tunnel failed. Falling back to Quick Tunnel (trycloudflare)..."
            fi
          fi

          if [ "$TUNNEL_STARTED" != "true" ]; then
            echo "=== Quick Tunnel Mode (trycloudflare.com) ==="
            nohup cloudflared tunnel \
              --url http://127.0.0.1:8989 \
              --no-autoupdate \
              > "$GITHUB_WORKSPACE/cloudflared.log" 2>&1 &

            CLOUDFLARED_PID=$!
            echo "$CLOUDFLARED_PID" > "$GITHUB_WORKSPACE/cloudflared.pid"

            echo "Waiting for tunnel URL..."
            TUNNEL_URL=""

            for i in {1..30}; do
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$GITHUB_WORKSPACE/cloudflared.log" | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$TUNNEL_URL" ]; then
              echo "Could not obtain tunnel URL."
              cat "$GITHUB_WORKSPACE/cloudflared.log"
              exit 1
            fi
          fi

          sleep 2
          CLOUDFLARED_PID=$(cat "$GITHUB_WORKSPACE/cloudflared.pid")
          if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo "Cloudflared failed to stay alive!"
            cat "$GITHUB_WORKSPACE/cloudflared.log"
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "       CLOUDFLARE TUNNEL LIVE"
          echo "=============================================="
          echo "$TUNNEL_URL"
          echo "=============================================="

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          {
            echo "# 🚀 Streamzy Proxy Live"
            echo ""
            echo "### 🌐 Cloudflare Tunnel"
            echo "\`$TUNNEL_URL\`"
            echo ""
            echo "### 🎬 Player"
            echo "[\`$TUNNEL_URL/player\`]($TUNNEL_URL/player)"
            echo ""
            echo "### 🔗 Proxy Endpoint"
            echo "\`$TUNNEL_URL/proxy?url=<encoded-url>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram != 'false' }}
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN || secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID || secrets.CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          echo "Sending Telegram alert..."
          REPO="${GITHUB_REPOSITORY}"
          RUN_ID="${GITHUB_RUN_ID}"

          TEXT="🚀 <b>Streamzy Proxy is Live!</b>%0A%0A"
          TEXT="${TEXT}🌐 <b>Tunnel:</b> <code>${TUNNEL_URL}</code>%0A"
          TEXT="${TEXT}🎬 <b>Player:</b> <code>${TUNNEL_URL}/player</code>%0A"
          TEXT="${TEXT}🔗 <b>Proxy API:</b> <code>${TUNNEL_URL}/proxy?url=...</code>%0A%0A"
          TEXT="${TEXT}📦 <b>Repo:</b> ${REPO}%0A"
          TEXT="${TEXT}⚡ <b>Run:</b> #${RUN_ID}"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true")

          echo "Telegram Response: $RESPONSE"

      - name: Keep proxy and tunnel alive
        shell: bash
        env:
          KEEPALIVE_HOURS: ${{ github.event.inputs.keepalive_hours || '6' }}
        run: |
          echo "=============================================="
          echo "PROXY IS RUNNING FOR ${KEEPALIVE_HOURS} HOUR(S)"
          echo "=============================================="

          MAX_SECONDS=$(( ${KEEPALIVE_HOURS:-6} * 3600 ))
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            EPROXY_PID=$(cat "$GITHUB_WORKSPACE/eproxy.pid" 2>/dev/null)
            CLOUDFLARED_PID=$(cat "$GITHUB_WORKSPACE/cloudflared.pid" 2>/dev/null)

            if ! kill -0 "$EPROXY_PID" 2>/dev/null; then
              echo "EProxy stopped unexpectedly!"
              cat "$GITHUB_WORKSPACE/eproxy.log" || true
              exit 1
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Cloudflared stopped unexpectedly!"
              cat "$GITHUB_WORKSPACE/cloudflared.log" || true
              exit 1
            fi

            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done

          echo "Completed duration limit. Exiting."

      - name: Show logs on failure
        if: always()
        shell: bash
        run: |
          echo "=== EPROXY LOG ==="
          cat "$GITHUB_WORKSPACE/eproxy.log" || true
          echo "=== CLOUDFLARED LOG ==="
          cat "$GITHUB_WORKSPACE/cloudflared.log" || true
