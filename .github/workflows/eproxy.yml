name: EProxy + Cloudflare Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1

      - name: Cache pip and Playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-playwright-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium 2>&1 | tail -5

      - name: Extract cookies with Playwright
        shell: bash
        env:
          EP_USERNAME: ${{ secrets.EP_USERNAME }}
          EP_PASSWORD: ${{ secrets.EP_PASSWORD }}
        run: |
          set -e

          EXTRACTOR=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "extract_cookies.py" -print -quit)

          if [ -z "$EXTRACTOR" ]; then
            echo "extract_cookies.py not found!"
            exit 1
          fi

          cd "$(dirname "$EXTRACTOR")"
          python "$(basename "$EXTRACTOR")"
          echo "[ok] cookies.txt ready"

      - name: Start EProxy with Gunicorn
        shell: bash
        env:
          STREAMZY_TOKEN: ${{ secrets.STREAMZY_TOKEN }}
          EP_USERNAME: ${{ secrets.EP_USERNAME }}
          EP_PASSWORD: ${{ secrets.EP_PASSWORD }}
        run: |
          set -e

          EPROXY=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "eproxy.py" -print -quit)

          if [ -z "$EPROXY" ]; then
            echo "eproxy.py not found!"
            exit 1
          fi

          cd "$(dirname "$EPROXY")"

          echo "Starting EProxy (gunicorn)..."

          nohup gunicorn \
            -w 2 --threads 16 \
            -b 0.0.0.0:8989 \
            --timeout 0 \
            --access-logfile - \
            eproxy:app \
            > "$GITHUB_WORKSPACE/eproxy.log" 2>&1 &

          EPROXY_PID=$!
          echo "$EPROXY_PID" > "$GITHUB_WORKSPACE/eproxy.pid"

          echo "EProxy PID: $EPROXY_PID"

          sleep 3

          if ! kill -0 "$EPROXY_PID" 2>/dev/null; then
            echo "EProxy stopped!"
            cat "$GITHUB_WORKSPACE/eproxy.log"
            exit 1
          fi

          echo "EProxy is running."

      - name: Check proxy port
        shell: bash
        run: |
          echo "Checking port 8989..."

          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/8989) >/dev/null 2>&1; then
              echo "Port 8989 is open."
              exit 0
            fi
            sleep 1
          done

          echo "Port 8989 is not open."
          cat eproxy.log || true
          exit 1

      - name: Install Cloudflared
        shell: bash
        run: |
          set -e

          curl -L \
            --fail --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          echo "Cloudflared version:"
          cloudflared --version

      - name: Start Cloudflare Tunnel
        shell: bash
        env:
          CF_CERT_TOKEN: ${{ secrets.CF_CERT_TOKEN }}
          CF_TUNNEL_NAME: ${{ secrets.CF_TUNNEL_NAME }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: |
          set -e

          if [ -n "$CF_CERT_TOKEN" ] && [ -n "$CF_TUNNEL_NAME" ] && [ -n "$CF_DOMAIN" ]; then
            echo "=== Named Tunnel Mode ==="
            echo "Tunnel: $CF_TUNNEL_NAME"
            echo "Domain: $CF_DOMAIN"

            mkdir -p ~/.cloudflared
            echo "$CF_CERT_TOKEN" | base64 -d > ~/.cloudflared/cert.pem

            nohup cloudflared tunnel \
              --origindisabled \
              run \
              --url http://127.0.0.1:8989 \
              "$CF_TUNNEL_NAME" \
              > cloudflared.log 2>&1 &

            TUNNEL_URL="https://$CF_DOMAIN"
          else
            echo "=== Quick Tunnel Mode (no named tunnel secrets) ==="

            nohup cloudflared tunnel \
              --url http://127.0.0.1:8989 \
              --no-autoupdate \
              > cloudflared.log 2>&1 &

            echo "Waiting for tunnel URL..."

            TUNNEL_URL=""

            for i in {1..60}; do
              TUNNEL_URL=$(grep -oE \
                'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                cloudflared.log \
                | head -n 1 || true)

              if [ -n "$TUNNEL_URL" ]; then
                break
              fi

              sleep 2
            done

            if [ -z "$TUNNEL_URL" ]; then
              echo "Could not obtain tunnel URL."
              cat cloudflared.log
              exit 1
            fi
          fi

          CLOUDFLARED_PID=$!
          echo "$CLOUDFLARED_PID" > cloudflared.pid

          sleep 3

          if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo "Cloudflared stopped!"
            cat cloudflared.log
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "       CLOUDFLARE TUNNEL"
          echo "=============================================="
          echo ""
          echo "$TUNNEL_URL"
          echo ""
          echo "=============================================="

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          {
            echo "# EProxy"
            echo ""
            echo "## Cloudflare Tunnel"
            echo ""
            echo "\`$TUNNEL_URL\`"
            echo ""
            echo "### Proxy endpoint"
            echo ""
            echo "$TUNNEL_URL/proxy?url=<encoded-url>"
            echo ""
            echo "### Player"
            echo ""
            echo "$TUNNEL_URL/player"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        id: deploy
        shell: bash
        run: |
          set -e

          mkdir -p _site

          sed "s|__TUNNEL_URL__|${TUNNEL_URL}|g" \
            docs/index.html > _site/index.html

          echo "Built _site/index.html with tunnel URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Verify processes
        shell: bash
        run: |
          EPROXY_PID=$(cat eproxy.pid)
          CLOUDFLARED_PID=$(cat cloudflared.pid)

          if kill -0 "$EPROXY_PID" 2>/dev/null; then
            echo "EProxy running"
          else
            echo "EProxy not running"
            cat eproxy.log || true
            exit 1
          fi

          if kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo "Cloudflared running"
          else
            echo "Cloudflared not running"
            cat cloudflared.log || true
            exit 1
          fi

      - name: Keep proxy and tunnel alive
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "             PROXY IS LIVE"
          echo "=============================================="
          echo ""
          echo "$TUNNEL_URL"
          echo ""
          echo "GitHub Pages: https://$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]').github.io/$(echo $GITHUB_REPOSITORY | cut -d/ -f2)/"
          echo "=============================================="

          while true; do
            EPROXY_PID=$(cat eproxy.pid 2>/dev/null)
            CLOUDFLARED_PID=$(cat cloudflared.pid 2>/dev/null)

            if ! kill -0 "$EPROXY_PID" 2>/dev/null; then
              echo "EProxy stopped!"
              cat eproxy.log || true
              exit 1
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Cloudflared stopped!"
              cat cloudflared.log || true
              exit 1
            fi

            sleep 30
          done

      - name: Show logs
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "               EPROXY LOG"
          echo "=============================================="
          cat eproxy.log || true

          echo ""
          echo "=============================================="
          echo "            CLOUDFLARED LOG"
          echo "=============================================="
          cat cloudflared.log || true
